<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" role="img" aria-labelledby="commitn-title commitn-desc">
  <title id="commitn-title">One commitment and every place that carries it</title>
  <desc id="commitn-desc">A commitment in the spec is joined to the four places in the work that carry it: chapter 3 states it, chapter 9 builds on it, chapter 14 returns to it, and the short edition retells it. The short edition is circled: it still retells the old position, and it was listed when the commitment changed.</desc>

  <text class="dg-text dg-small dg-faint" x="20" y="18">The spec</text>
  <rect class="dg-box" x="20" y="28" width="320" height="104" rx="3"/>
  <text class="dg-text dg-label" x="38" y="60">A commitment</text>
  <text class="dg-mono" x="38" y="84">{#the-claim}</text>
  <rect class="dg-shade" x="38" y="100" width="250" height="6" rx="2"/>
  <rect class="dg-shade" x="38" y="114" width="190" height="6" rx="2"/>

  <path class="dg-line" d="M40 132 V480"/>
  <circle class="dg-ink" cx="40" cy="132" r="4"/>
  <path class="dg-line" d="M40 210 H60"/>
  <path class="dg-line" d="M40 300 H60"/>
  <path class="dg-line" d="M40 390 H60"/>
  <path class="dg-line" d="M40 480 H60"/>
  <circle class="dg-ink" cx="60" cy="210" r="4"/>
  <circle class="dg-ink" cx="60" cy="300" r="4"/>
  <circle class="dg-ink" cx="60" cy="390" r="4"/>
  <circle class="dg-ink" cx="60" cy="480" r="4"/>

  <text class="dg-text dg-small dg-faint" x="60" y="162">Where the work carries it</text>

  <rect class="dg-box" x="60" y="172" width="280" height="78" rx="3"/>
  <text class="dg-text dg-head" x="78" y="198">Chapter 3</text>
  <text class="dg-text dg-small dg-faint" x="78" y="218">states it</text>
  <rect class="dg-shade" x="78" y="232" width="200" height="6" rx="2"/>

  <rect class="dg-box" x="60" y="262" width="280" height="78" rx="3"/>
  <text class="dg-text dg-head" x="78" y="288">Chapter 9</text>
  <text class="dg-text dg-small dg-faint" x="78" y="308">builds on it</text>
  <rect class="dg-shade" x="78" y="322" width="170" height="6" rx="2"/>

  <rect class="dg-box" x="60" y="352" width="280" height="78" rx="3"/>
  <text class="dg-text dg-head" x="78" y="378">Chapter 14</text>
  <text class="dg-text dg-small dg-faint" x="78" y="398">returns to it</text>
  <rect class="dg-shade" x="78" y="412" width="186" height="6" rx="2"/>

  <rect class="dg-box" x="60" y="442" width="280" height="84" rx="3"/>
  <text class="dg-text dg-head" x="78" y="468">The short edition</text>
  <text class="dg-text dg-small dg-faint" x="78" y="488">retells it</text>
  <rect class="dg-shade" x="78" y="504" width="150" height="6" rx="2"/>
  <path class="dg-signal draw" pathLength="1" d="M78 501 C104 495 190 494 232 500 C248 503 245 514 222 517 C180 522 108 522 80 516 C64 512 66 503 86 499 C102 496 118 495 136 495"/>

  <text class="dg-text dg-small" x="60" y="556">Still retells the old position.</text>
  <text class="dg-text dg-small dg-faint" x="60" y="575">Listed when the commitment changed.</text>
</svg>
