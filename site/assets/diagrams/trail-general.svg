<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="trailg-title trailg-desc">
  <title id="trailg-title">The trail of a commitment</title>
  <desc id="trailg-desc">Six breadcrumbs from three sessions, oldest first, under one commitment. In a session in June, the author first stated it in passing, then made it precise. In one in August, the author refused a drafted wording, and tried a stronger version without settling it. Last week, the author changed position on new evidence, and took a wording the companion drafted.</desc>

  <text class="dg-text dg-label" x="20" y="30">A commitment</text>
  <text class="dg-mono" x="20" y="52">{#the-claim}   6 breadcrumbs, 3 sessions</text>

  <line class="dg-line" x1="30" y1="176" x2="860" y2="176"/>
  <line class="dg-thin" x1="30" y1="62" x2="30" y2="176"/>

  <g text-anchor="middle">
    <text class="dg-text dg-label" x="104" y="98">seed</text>
    <text class="dg-text dg-small" x="104" y="120">First stated,</text>
    <text class="dg-text dg-small" x="104" y="138">in passing</text>

    <text class="dg-text dg-label" x="236" y="98">sharpen</text>
    <text class="dg-text dg-small" x="236" y="120">Made precise</text>

    <text class="dg-text dg-label" x="372" y="98">correct</text>
    <text class="dg-text dg-small" x="372" y="120">Refused a</text>
    <text class="dg-text dg-small" x="372" y="138">drafted wording</text>

    <text class="dg-text dg-label" x="520" y="98">probe</text>
    <text class="dg-text dg-small" x="520" y="120">Tried a stronger</text>
    <text class="dg-text dg-small" x="520" y="138">version, unsettled</text>

    <text class="dg-text dg-label" x="664" y="98">reverse</text>
    <text class="dg-text dg-small" x="664" y="120">Changed position</text>
    <text class="dg-text dg-small" x="664" y="138">on new evidence</text>

    <text class="dg-text dg-label" x="796" y="98">accept</text>
    <text class="dg-text dg-small" x="796" y="120">Took the</text>
    <text class="dg-text dg-small" x="796" y="138">companion’s wording</text>

    <text class="dg-text dg-small dg-faint" x="104" y="204">turn 2</text>
    <text class="dg-text dg-small dg-faint" x="236" y="204">turn 9</text>
    <text class="dg-text dg-small dg-faint" x="372" y="204">turn 4</text>
    <text class="dg-text dg-small dg-faint" x="520" y="204">turn 11</text>
    <text class="dg-text dg-small dg-faint" x="664" y="204">turn 1</text>
    <text class="dg-text dg-small dg-faint" x="796" y="204">turn 3</text>

    <text class="dg-text dg-small" x="170" y="262">a session in June</text>
    <text class="dg-text dg-small" x="446" y="262">one in August</text>
    <text class="dg-text dg-small" x="730" y="262">one last week</text>
  </g>

  <circle class="dg-ink" cx="104" cy="176" r="6"/>
  <circle class="dg-ink" cx="236" cy="176" r="6"/>
  <circle class="dg-ink" cx="372" cy="176" r="6"/>
  <circle class="dg-ink" cx="520" cy="176" r="6"/>
  <path class="dg-box" d="M664 165 L675 176 L664 187 L653 176 z"/>
  <circle class="dg-ink" cx="796" cy="176" r="6"/>

  <path class="dg-thin" d="M64 226 v8 h212 v-8"/>
  <path class="dg-thin" d="M332 226 v8 h228 v-8"/>
  <path class="dg-thin" d="M624 226 v8 h212 v-8"/>
  <line class="dg-thin" x1="170" y1="234" x2="170" y2="246"/>
  <line class="dg-thin" x1="446" y1="234" x2="446" y2="246"/>
  <line class="dg-thin" x1="730" y1="234" x2="730" y2="246"/>
</svg>
