<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 472" role="img" aria-labelledby="commit-title commit-desc">
  <title id="commit-title">One commitment and every place that carries it</title>
  <desc id="commit-desc">A commitment in the spec is joined to the four places in the work that carry it: chapter 3 states it, chapter 9 builds on it, chapter 14 returns to it, and the short edition retells it. The short edition is circled: it still retells the old position, and it was listed when the commitment changed.</desc>

  <text class="dg-text dg-small dg-faint" x="20" y="118">The spec</text>
  <rect class="dg-box" x="20" y="130" width="280" height="172" rx="3"/>
  <text class="dg-text dg-label" x="40" y="170">A commitment</text>
  <text class="dg-mono" x="40" y="196">{#the-claim}</text>
  <rect class="dg-shade" x="40" y="222" width="224" height="6" rx="2"/>
  <rect class="dg-shade" x="40" y="238" width="206" height="6" rx="2"/>
  <rect class="dg-shade" x="40" y="254" width="224" height="6" rx="2"/>
  <rect class="dg-shade" x="40" y="270" width="140" height="6" rx="2"/>

  <path class="dg-line" d="M300 216 C400 216 400 72 500 72"/>
  <path class="dg-line" d="M300 216 C400 216 400 170 500 170"/>
  <path class="dg-line" d="M300 216 C400 216 400 268 500 268"/>
  <path class="dg-line" d="M300 216 C400 216 400 366 500 366"/>
  <circle class="dg-ink" cx="300" cy="216" r="4"/>
  <circle class="dg-ink" cx="500" cy="72" r="4"/>
  <circle class="dg-ink" cx="500" cy="170" r="4"/>
  <circle class="dg-ink" cx="500" cy="268" r="4"/>
  <circle class="dg-ink" cx="500" cy="366" r="4"/>

  <text class="dg-text dg-small dg-faint" x="500" y="20">Where the work carries it</text>

  <rect class="dg-box" x="500" y="28" width="360" height="88" rx="3"/>
  <text class="dg-text dg-label" x="520" y="56">Chapter 3</text>
  <text class="dg-text dg-small dg-faint" x="520" y="78">states it</text>
  <rect class="dg-shade" x="520" y="96" width="250" height="6" rx="2"/>

  <rect class="dg-box" x="500" y="126" width="360" height="88" rx="3"/>
  <text class="dg-text dg-label" x="520" y="154">Chapter 9</text>
  <text class="dg-text dg-small dg-faint" x="520" y="176">builds on it</text>
  <rect class="dg-shade" x="520" y="194" width="214" height="6" rx="2"/>

  <rect class="dg-box" x="500" y="224" width="360" height="88" rx="3"/>
  <text class="dg-text dg-label" x="520" y="252">Chapter 14</text>
  <text class="dg-text dg-small dg-faint" x="520" y="274">returns to it</text>
  <rect class="dg-shade" x="520" y="292" width="236" height="6" rx="2"/>

  <rect class="dg-box" x="500" y="322" width="360" height="88" rx="3"/>
  <text class="dg-text dg-label" x="520" y="350">The short edition</text>
  <text class="dg-text dg-small dg-faint" x="520" y="372">retells it</text>
  <rect class="dg-shade" x="520" y="390" width="180" height="6" rx="2"/>
  <path class="dg-signal draw" pathLength="1" d="M520 387 C552 381 652 380 704 386 C722 389 718 401 690 404 C640 409 556 409 522 403 C504 399 506 389 528 385 C548 382 566 381 586 381"/>

  <text class="dg-text dg-small" x="500" y="440">Still retells the old position.</text>
  <text class="dg-text dg-small dg-faint" x="500" y="460">Listed when the commitment changed.</text>
</svg>
