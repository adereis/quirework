<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-labelledby="bindn-title bindn-desc">
  <title id="bindn-title">One commitment and the four places that carry it</title>
  <desc id="bindn-desc">A section of Side Quest's spec, "The name came from quire", is joined to the four documents that bind it: the book's chapter, the poems, the six-pager and the young readers' edition. The young readers' edition is circled: after the author corrected the story, it defined the word quire, where its own notes say to show it.</desc>

  <text class="dg-text dg-small dg-faint" x="20" y="18">The spec</text>
  <rect class="dg-box" x="20" y="28" width="320" height="104" rx="3"/>
  <text class="dg-text dg-label" x="38" y="60">The name came from “quire”</text>
  <text class="dg-mono" x="38" y="84">{#the-name}</text>
  <rect class="dg-shade" x="38" y="100" width="250" height="6" rx="2"/>
  <rect class="dg-shade" x="38" y="114" width="190" height="6" rx="2"/>

  <path class="dg-line" d="M40 132 V480"/>
  <circle class="dg-ink" cx="40" cy="132" r="4"/>
  <path class="dg-line" d="M40 210 H60"/>
  <path class="dg-line" d="M40 300 H60"/>
  <path class="dg-line" d="M40 390 H60"/>
  <path class="dg-line" d="M40 480 H60"/>
  <circle class="dg-ink" cx="60" cy="210" r="4"/>
  <circle class="dg-ink" cx="60" cy="300" r="4"/>
  <circle class="dg-ink" cx="60" cy="390" r="4"/>
  <circle class="dg-ink" cx="60" cy="480" r="4"/>

  <text class="dg-text dg-small dg-faint" x="60" y="162">Where it is carried</text>

  <rect class="dg-box" x="60" y="172" width="280" height="78" rx="3"/>
  <text class="dg-text dg-head" x="78" y="198">The book</text>
  <text class="dg-text dg-small dg-faint" x="78" y="218">Chapter 5, The Name</text>
  <rect class="dg-shade" x="78" y="232" width="200" height="6" rx="2"/>

  <rect class="dg-box" x="60" y="262" width="280" height="78" rx="3"/>
  <text class="dg-text dg-head" x="78" y="288">The poems</text>
  <text class="dg-text dg-small dg-faint" x="78" y="308">The Name, in anapestic couplets</text>
  <rect class="dg-shade" x="78" y="322" width="170" height="6" rx="2"/>

  <rect class="dg-box" x="60" y="352" width="280" height="78" rx="3"/>
  <text class="dg-text dg-head" x="78" y="378">The six-pager</text>
  <text class="dg-text dg-small dg-faint" x="78" y="398">One memo, in the part about Otto</text>
  <rect class="dg-shade" x="78" y="412" width="186" height="6" rx="2"/>

  <rect class="dg-box" x="60" y="442" width="280" height="84" rx="3"/>
  <text class="dg-text dg-head" x="78" y="468">The young readers’ edition</text>
  <text class="dg-text dg-small dg-faint" x="78" y="488">The Name, for readers of about ten</text>
  <rect class="dg-shade" x="78" y="504" width="150" height="6" rx="2"/>
  <path class="dg-signal draw" pathLength="1" d="M78 501 C104 495 190 494 232 500 C248 503 245 514 222 517 C180 522 108 522 80 516 C64 512 66 503 86 499 C102 496 118 495 136 495"/>

  <text class="dg-text dg-small" x="60" y="556">Defines “quire”, where its notes</text>
  <text class="dg-text dg-small" x="60" y="575">say to show it.</text>
  <text class="dg-text dg-small dg-faint" x="60" y="600">Found by an independent</text>
  <text class="dg-text dg-small dg-faint" x="60" y="619">consistency review.</text>
</svg>
