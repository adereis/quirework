<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="trail-title trail-desc">
  <title id="trail-title">The trail of one commitment</title>
  <desc id="trail-desc">Six breadcrumbs from three sessions, oldest first, under the spec section "The name came from quire". A seed: Otto completed quirk as quirework. A correction: the author cuts a drafted line on who named the tool. A sharpening: the evening of names and the first commit. A reversal: the page of names ends on quire, and Otto only finished the word. Two more sharpenings: the chapter admits the mistake once, and the admission is quoted word for word in the spec.</desc>

  <text class="dg-text dg-label" x="20" y="30">The name came from “quire”</text>
  <text class="dg-mono" x="20" y="52">{#the-name}   6 breadcrumbs, 3 sessions</text>

  <line class="dg-line" x1="30" y1="176" x2="860" y2="176"/>
  <line class="dg-thin" x1="30" y1="62" x2="30" y2="176"/>

  <g text-anchor="middle">
    <text class="dg-text dg-label" x="104" y="98">seed</text>
    <text class="dg-text dg-small" x="104" y="120">Otto completed</text>
    <text class="dg-text dg-small" x="104" y="138">“quirk” as</text>
    <text class="dg-text dg-small" x="104" y="156">quirework</text>

    <text class="dg-text dg-label" x="236" y="98">correct</text>
    <text class="dg-text dg-small" x="236" y="120">Cuts a drafted</text>
    <text class="dg-text dg-small" x="236" y="138">line on who</text>
    <text class="dg-text dg-small" x="236" y="156">named the tool</text>

    <text class="dg-text dg-label" x="372" y="98">sharpen</text>
    <text class="dg-text dg-small" x="372" y="120">The evening of</text>
    <text class="dg-text dg-small" x="372" y="138">names, and the</text>
    <text class="dg-text dg-small" x="372" y="156">first commit</text>

    <text class="dg-text dg-label" x="520" y="98">reverse</text>
    <text class="dg-text dg-small" x="520" y="120">The page of names</text>
    <text class="dg-text dg-small" x="520" y="138">ends on “quire”;</text>
    <text class="dg-text dg-small" x="520" y="156">Otto only finished it</text>

    <text class="dg-text dg-label" x="664" y="98">sharpen</text>
    <text class="dg-text dg-small" x="664" y="120">The chapter</text>
    <text class="dg-text dg-small" x="664" y="138">admits the</text>
    <text class="dg-text dg-small" x="664" y="156">mistake, once</text>

    <text class="dg-text dg-label" x="796" y="98">sharpen</text>
    <text class="dg-text dg-small" x="796" y="120">The admission,</text>
    <text class="dg-text dg-small" x="796" y="138">quoted word for</text>
    <text class="dg-text dg-small" x="796" y="156">word in the spec</text>

    <text class="dg-text dg-small dg-faint" x="104" y="204">turn 3</text>
    <text class="dg-text dg-small dg-faint" x="236" y="204">turn 4</text>
    <text class="dg-text dg-small dg-faint" x="372" y="204">turn 1</text>
    <text class="dg-text dg-small dg-faint" x="520" y="204">turn 1</text>
    <text class="dg-text dg-small dg-faint" x="664" y="204">turn 2</text>
    <text class="dg-text dg-small dg-faint" x="796" y="204">turn 3</text>

    <text class="dg-mono" x="170" y="262">session 1b7ad009</text>
    <text class="dg-mono" x="372" y="262">26d889c8</text>
    <text class="dg-mono" x="658" y="262">session c137540e</text>
  </g>

  <circle class="dg-ink" cx="104" cy="176" r="6"/>
  <circle class="dg-ink" cx="236" cy="176" r="6"/>
  <circle class="dg-ink" cx="372" cy="176" r="6"/>
  <path class="dg-box" d="M520 165 L531 176 L520 187 L509 176 z"/>
  <circle class="dg-ink" cx="664" cy="176" r="6"/>
  <circle class="dg-ink" cx="796" cy="176" r="6"/>

  <path class="dg-thin" d="M64 226 v8 h212 v-8"/>
  <path class="dg-thin" d="M332 226 v8 h80 v-8"/>
  <path class="dg-thin" d="M470 226 v8 h376 v-8"/>
  <line class="dg-thin" x1="170" y1="234" x2="170" y2="246"/>
  <line class="dg-thin" x1="372" y1="234" x2="372" y2="246"/>
  <line class="dg-thin" x1="658" y1="234" x2="658" y2="246"/>
</svg>
