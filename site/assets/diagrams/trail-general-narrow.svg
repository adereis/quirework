<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="trailn-title trailn-desc">
<title id="trailn-title">The trail of a commitment</title>
<desc id="trailn-desc">Six moments, oldest first. Each points to a turn in a conversation. A change of mind is added without replacing earlier decisions.</desc>
<path class="dg-thin" d="M20 38 V438"/>
<circle class="dg-box" cx="20" cy="38" r="6"/>
<text class="dg-text dg-label" x="44" y="43">Seed</text>
<text class="dg-text dg-small dg-faint" x="44" y="67">First stated, in passing</text>
<circle class="dg-box" cx="20" cy="118" r="6"/>
<text class="dg-text dg-label" x="44" y="123">Sharpen</text>
<text class="dg-text dg-small dg-faint" x="44" y="147">Made precise</text>
<circle class="dg-box" cx="20" cy="198" r="6"/>
<text class="dg-text dg-label" x="44" y="203">Correct</text>
<text class="dg-text dg-small dg-faint" x="44" y="227">Refused a drafted wording</text>
<circle class="dg-box" cx="20" cy="278" r="6"/>
<text class="dg-text dg-label" x="44" y="283">Probe</text>
<text class="dg-text dg-small dg-faint" x="44" y="307">Tried a stronger version</text>
<circle class="dg-box" cx="20" cy="358" r="6"/>
<text class="dg-text dg-label" x="44" y="363">Reverse</text>
<text class="dg-text dg-small dg-faint" x="44" y="387">Changed position on new evidence</text>
<circle class="dg-box" cx="20" cy="438" r="6"/>
<text class="dg-text dg-label" x="44" y="443">Accept</text>
<text class="dg-text dg-small dg-faint" x="44" y="467">Took your companion’s wording</text>
<text class="dg-text dg-small" x="44" y="505">Each moment points to your own words.</text>
</svg>
