[project]
name = "quirework"
dynamic = ["version"]
description = "Tools for writing and researching books and sites with an AI companion"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ademar Reis"}]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.urls]
Homepage = "https://quirework.com"
Source = "https://github.com/adereis/quirework"
Documentation = "https://github.com/adereis/quirework/tree/main/docs"
Issues = "https://github.com/adereis/quirework/issues"

[project.optional-dependencies]
capture = ["websocket-client>=1.6"]
quarto = ["quarto-cli>=1.5", "pypdf>=4", "fonttools[woff]>=4.40", "Pillow>=9.4"]
semantic = ["numpy>=1.24", "fastembed>=0.4"]
test = ["pytest>=8"]
dev = ["quirework[capture,quarto,semantic,test]"]

[project.scripts]
quirework = "quirework.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "quirework.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A passing test's directory goes as soon as it passes; tests/conftest.py
# removes the rest of a passing session's run.
tmp_path_retention_policy = "failed"
markers = ["live: reaches a real provider; skipped unless QUIREWORK_LIVE=1"]

[tool.setuptools.package-data]
quirework = ["templates/*.toml", "templates/*.conf", "publish/*.js"]
