[project]
name = "quirework"
version = "0.1.0"
description = "Tools for writing and researching books and sites with an AI companion"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
capture = ["websocket-client>=1.6"]
quarto = ["quarto-cli>=1.5", "pypdf>=4", "fonttools[woff]>=4.40", "Pillow>=9.4"]
semantic = ["numpy>=1.24", "fastembed>=0.4"]
test = ["pytest>=8"]
dev = ["quirework[capture,quarto,semantic,test]"]

[project.scripts]
quirework = "quirework.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A passing test's directory goes as soon as it passes; tests/conftest.py
# removes the rest of a passing session's run.
tmp_path_retention_policy = "failed"
markers = ["live: invokes a paid provider; requires explicit authorization"]

[tool.setuptools.package-data]
quirework = ["templates/*.toml", "templates/*.conf"]
