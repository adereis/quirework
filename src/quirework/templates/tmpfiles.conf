# Quirework cache cleanup, for systemd-tmpfiles.
#
# Nothing empties the XDG cache directory on its own. The specification
# permits deleting cached data at any time but obliges no one to do it, and a
# stock Linux system ships no cleaner for it, which is why a working machine's
# ~/.cache grows without bound. This rule is how a directory under it becomes
# collectible: systemd-tmpfiles-clean.timer runs daily in the user session and
# applies whatever it finds here.
#
# Install it, and optionally apply it at once rather than waiting for the
# timer:
#
#   quirework config template tmpfiles \
#     --out ~/.config/user-tmpfiles.d/quirework.conf
#   systemd-tmpfiles --user --clean
#
# A distribution package puts the same file in
# /usr/share/user-tmpfiles.d/quirework.conf instead, where a user's own copy
# in ~/.config still overrides it.
#
# Everything Quirework keeps in the cache is derived: downloaded tools such as
# an EPUB validator, redacted renderings, staging for an analysis. Losing any
# of it costs a rebuild, never a result. Run records are deliberately NOT here
# -- they are evidence, they live under the XDG state directory, and no rule
# in this file should ever reach them.
#
# `e` cleans the contents of a directory that already exists and never creates
# one, so this stays inert until Quirework has cached something. An entry is
# removed only when its access, modification and status times are all older
# than the age, so a project you are still working in keeps its cache and an
# abandoned one does not.
#
# Type Path            Mode User Group Age
e      %C/quirework    -    -    -     30d
