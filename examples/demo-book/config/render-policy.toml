# Read by `quirework publish build` through the matching setting in
# quirework.toml. Project policy, not a change to the reusable tool.

# Chapters emptied in the print stage only. Quarto pins index.qmd to
# reading position 1 in every format, so the welcome page that opens the
# web edition would otherwise print as chapter one of the PDF, between
# the title page and the real opening. It is emptied rather than removed
# because Quarto refuses a book whose chapter list has no home page. The
# source file and every other edition keep their content.
"print_drops" = ["index.qmd"]
