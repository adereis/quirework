lang: en-US
project:
  type: book
book:
  title: "Chapter and Verse Control"
  subtitle: "A short fiction about the engineer who built Quirework"
  author: "Prue Vennance"
  cover-image: cover.png
  cover-image-alt: "A line drawing of a homemade contraption on a
    desk, built from a bicycle wheel, a colander and a funnel. A
    tangled rust-colored thread feeds into one side; a neat row of
    small teal tags hangs from the other. The title, subtitle and
    author's name sit above it."
  chapters:
    - index.qmd
    - sections/preface.qmd
    - sections/the-book-that-disagreed-with-itself.qmd
    - sections/the-sidecar.qmd
# Four editions from one source. `quirework publish build` stages each of
# them separately, because they disagree about front matter and about
# parts, and it checks afterwards that a figure carries the same number
# in all four.
format:
  html:
    theme: cosmo
  # The print interior. Page size and margins come from Quarto's own book
  # template, which applies them after any `papersize` set here and wins;
  # a book that wants its own geometry supplies publish.typst_template, which
  # is also where `quirework publish fonts` reads the faces the build needs.
  typst:
    template-partials:
      - typst-show.typ
  epub:
    toc: true
  docx: default
