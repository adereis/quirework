<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect x="0" y="0" width="960" height="540" fill="#f7f4ee"/>

  <!-- ground -->
  <line x1="40" y1="440" x2="920" y2="440" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>

  <!-- sidecar body (a note, attached apparatus) -->
  <path d="M 260 430 Q 258 336 340 332 Q 424 336 422 430 Z"
        fill="#f7f4ee" stroke="#2a6f6f" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="340" cy="430" r="52" fill="#f7f4ee" stroke="#2a6f6f" stroke-width="10"/>
  <circle cx="340" cy="430" r="10" fill="#2a6f6f"/>

  <!-- struts: the connection, never the bike, never the sidecar -->
  <line x1="422" y1="378" x2="576" y2="378" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <line x1="422" y1="418" x2="580" y2="418" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>

  <!-- the bike (the chapter, the permanent thing) -->
  <circle cx="580" cy="430" r="75" fill="#f7f4ee" stroke="#1a1a1a" stroke-width="10"/>
  <circle cx="580" cy="430" r="12" fill="#1a1a1a"/>
  <circle cx="780" cy="430" r="75" fill="#f7f4ee" stroke="#1a1a1a" stroke-width="10"/>
  <circle cx="780" cy="430" r="12" fill="#1a1a1a"/>
  <path d="M 580 430 L 542 308 L 640 288 L 722 253 L 780 430"
        fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="560" cy="298" rx="46" ry="15" fill="#1a1a1a"/>
  <line x1="722" y1="253" x2="752" y2="216" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
  <circle cx="752" cy="214" r="11" fill="#1a1a1a"/>

  <!-- labels: one to three words, sentence case, no terminal punctuation -->
  <text x="345" y="150" text-anchor="middle" fill="#2a6f6f"
        font-family="Liberation Serif" font-size="22">the marks</text>
  <text x="670" y="150" text-anchor="middle" fill="#1a1a1a"
        font-family="Liberation Serif" font-size="22">the chapter</text>
</svg>
