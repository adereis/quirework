schema = 2

[project]
name = "Side Quest"
# Ignored by git: working notes with no authority, and material that must
# never publish.
scratchpad = "scratchpad"
private = "private"

[manuscript]
source = "manuscript"
quarto = "manuscript/_quarto.yml"
chapters = "manuscript/sections"
spec = "manuscript/sections/_spec.md"
# Where each spec section came from: pointers into the sessions, kept in
# the provenance ledger rather than in the spec, which states only what
# holds now.
spec_trail = "provenance/spec-trail.md"
noncanonical_roots = ["scratchpad"]

[publish]
build = "build"
figures = "manuscript/sections/illustrations"
# The book's two inks, black and the one orange, with grays between.
# `quirework dev check` runs the same rule.
figure_checks = ["sq_checks.figures:two_inks"]
# The derived editions: a six-pager, a young readers' edition and the
# poems, each made from the book and answering to its spec.
variants = "variants"
variant_policy = "procedures/variant-policy.toml"

[sops]
root = "procedures"
catalog = "procedures/catalog.json"
skill_prefix = "sq-"
personas = "procedures/personas"
instruments = "procedures/instruments"
# A blind read: a reader who opens the book's chapters one at a time and
# reacts to each before the next. The closing question is asked only
# after the last chapter.
default_reader = "blind-read"
reader_presets = { blind-read = { instrument = "blind-read", include_matter = true, delivery = ["self-driven"], ask = "reaction", wrap_ask = "wrap" } }

[checks]
# The book's own suite, in sq_checks/: the default suite, plus the house
# rule against em dashes.
command = "sq_checks.prose:main"

[providers]
# The cheap model each runner's blindness canary runs on. Without an entry
# a Claude or Codex seat refuses to launch rather than canary on the
# account's default.
canary_models = {claude = "haiku", codex = "luna"}
isolation_policy = "procedures/isolation.toml"

[runs]
# Saved run records: what a model wrote, kept as it wrote it. Never
# reflowed, never read as authority, and never held to the house rules.
evidence_roots = ["provenance/workshops", "provenance/rooms", "provenance/roundtables", "provenance/readings", "provenance/reviews"]
# Consistency reviews of a delta, by a model that did not make the edit.
reviews = "provenance/reviews"

[text]
# A poem's line breaks are its lines, so the poems are never reflowed:
# trailing whitespace is stripped and nothing else. Everything else keeps
# the built-in rule.
modes = [["variants/poems/*.qmd", "trailing"]]

[provenance]
enabled = true
# Committed, ledger and sessions both. The configuration guide keeps a
# project's store outside its repository; this example keeps its store
# inside, in provenance/store, because an example of a provenance corpus
# that holds no sessions teaches nothing. While the book was written the
# store lived in the author's provenance home.
root = "provenance"
store_dir = "provenance/store"
